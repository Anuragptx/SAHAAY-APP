<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SAHAAY - Live Map View</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#e9edff",
                    "tertiary": "#004ed0",
                    "inverse-on-surface": "#edf0ff",
                    "outline-variant": "#e6bdb8",
                    "surface-tint": "#bf0715",
                    "error": "#ba1a1a",
                    "surface": "#f9f9ff",
                    "secondary": "#735c00",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#ffe083",
                    "surface-variant": "#dce2f7",
                    "tertiary-fixed-dim": "#b4c5ff",
                    "on-secondary-fixed": "#231b00",
                    "surface-container-highest": "#dce2f7",
                    "primary-fixed": "#ffdad6",
                    "on-tertiary-fixed-variant": "#003ea8",
                    "error-container": "#ffdad6",
                    "tertiary-container": "#2d68f0",
                    "on-background": "#141b2b",
                    "surface-container-high": "#e1e8fd",
                    "background": "#f9f9ff",
                    "tertiary-fixed": "#dbe1ff",
                    "inverse-primary": "#ffb4ab",
                    "on-primary-fixed-variant": "#93000b",
                    "on-surface-variant": "#5c403c",
                    "on-surface": "#141b2b",
                    "surface-container-lowest": "#ffffff",
                    "inverse-surface": "#293040",
                    "on-primary-container": "#fff6f5",
                    "on-tertiary": "#ffffff",
                    "primary-fixed-dim": "#ffb4ab",
                    "on-tertiary-fixed": "#00174b",
                    "on-secondary-fixed-variant": "#574500",
                    "secondary-fixed-dim": "#eec200",
                    "on-primary-fixed": "#410002",
                    "outline": "#916f6b",
                    "primary": "#b70011",
                    "on-secondary-container": "#6f5900",
                    "on-error-container": "#93000a",
                    "secondary-container": "#fed01b",
                    "primary-container": "#dc2626",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-dim": "#d3daef",
                    "surface-container-low": "#f1f3ff",
                    "surface-bright": "#f9f9ff",
                    "on-tertiary-container": "#f8f7ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "4px",
                    "safe-margin": "20px",
                    "lg": "24px",
                    "sm": "8px",
                    "xs": "4px",
                    "xl": "48px",
                    "gutter": "16px",
                    "md": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter", "sans-serif"],
                    "status-number": ["Inter", "sans-serif"],
                    "headline-lg": ["Inter", "sans-serif"],
                    "display-sos": ["Inter", "sans-serif"],
                    "body-md": ["Inter", "sans-serif"],
                    "headline-md": ["Inter", "sans-serif"],
                    "body-lg": ["Inter", "sans-serif"],
                    "label-bold": ["Inter", "sans-serif"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "status-number": ["20px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "display-sos": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-bold": ["14px", {"lineHeight": "20px", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        /* Essential specific styles for animations and map rendering */
        @keyframes emergency-pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .pulse-marker {
            animation: emergency-pulse 2s infinite;
        }
        
        /* Map background overlay to simulate streets visually */
        .map-grid-overlay {
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden flex flex-col relative select-none">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm fixed full-width top-0 w-full z-[60] flex justify-between items-center px-safe-margin h-16">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
<span class="text-headline-md font-headline-md font-black tracking-tighter text-primary">SAHAAY</span>
</div>
<button class="text-primary font-bold text-sm tracking-wide bg-surface-container-low hover:bg-surface-variant/50 transition-colors px-4 py-2 rounded-full flex items-center gap-2 min-h-[48px]">
<span>Anonymous Session</span>
</button>
</header>
<!-- Main Canvas: Live Map Area -->
<main class="flex-1 w-full relative z-0 mt-16 mb-[88px]">
<!-- Full-screen Leaflet.js map placeholder -->
<div class="absolute inset-0 w-full h-full bg-[#e5e3df] bg-cover bg-center map-grid-overlay" data-location="New Delhi Metropolitan Area Map View with clear street layouts and a river crossing" id="map" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB3yBS-5fU1jL_q6g9uFZlGSPoAQVfqLLPeqXYpC3tYcaYIZNyMTE5HxaAJkYn9RPakJjFQ8OMv7UJY1yjPGDyOWUCvHsVjPpd1rHpmk7Cd8K8xU3k9XFHJo0ccllyEH28IHa6vFv_Gsk_BYAaqgdg6jDqhZYuXbeC5EYH_vu6v2zbKnORVi3l6novkhFk1GVsOKdoABvDMEDqtipDC-b_kResKxbzAOl03Hq_81O0TEz-JouaSNJSP4pdfM0eEcaaI0NeLbQduuorX')">
</div>
<!-- Safe Area Padding Container for Overlays -->
<div class="absolute inset-0 pointer-events-none p-safe-margin pt-6 pb-24 flex flex-col justify-between">
<!-- Top Section: Legend -->
<div class="flex justify-between items-start">
<div class="bg-surface rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.1)] p-4 pointer-events-auto border border-surface-variant/50 backdrop-blur-sm bg-surface/95">
<h2 class="font-label-bold text-label-bold text-on-surface mb-3 uppercase tracking-wider text-xs">Active Alerts Range: 2km</h2>
<ul class="space-y-3">
<li class="flex items-center gap-3">
<div class="w-4 h-4 rounded-full bg-primary-container border-2 border-surface shadow-sm"></div>
<span class="font-body-md text-sm text-on-surface-variant">Medical Emergency</span>
</li>
<li class="flex items-center gap-3">
<div class="w-4 h-4 rounded-full bg-secondary-container border-2 border-surface shadow-sm"></div>
<span class="font-body-md text-sm text-on-surface-variant">Technical/Mechanical</span>
</li>
</ul>
</div>
<!-- Connection Status Badge -->
<div class="bg-surface rounded-full shadow-sm px-3 py-1.5 pointer-events-auto flex items-center gap-2 border border-surface-variant/30">
<div class="w-2 h-2 rounded-full bg-[#10B981] shadow-[0_0_8px_#10B981]"></div>
<span class="font-label-bold text-xs text-on-surface-variant">GPS Active</span>
</div>
</div>
<!-- Interactive Map Elements (Simulated Absolute Positioning on Map) -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none overflow-hidden">
<!-- Active Incident Marker & Popup Group -->
<div class="absolute top-[40%] left-[30%] pointer-events-auto flex flex-col items-center">
<!-- Information Popup (Glassmorphism style) -->
<div class="mb-3 bg-surface w-64 rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.15)] border-l-[6px] border-primary-container overflow-hidden translate-y-0 transition-transform origin-bottom scale-100">
<div class="p-4 bg-surface-container-lowest">
<div class="flex justify-between items-start mb-1">
<span class="font-label-bold text-primary-container text-xs uppercase tracking-wider">Medical</span>
<span class="bg-error/10 text-error px-2 py-0.5 rounded-full font-label-bold text-[10px] flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">timer</span> 04:15
                                </span>
</div>
<h3 class="font-headline-md text-[16px] leading-tight text-on-surface mb-1">Cardiac Arrest Suspected</h3>
<p class="font-body-md text-sm text-on-surface-variant mb-4 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">near_me</span> 1.2 km away
                            </p>
<!-- SOS Primary Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold py-3 rounded-lg flex justify-center items-center gap-2 active:scale-95 transition-transform shadow-sm min-h-[48px] border-[2px] border-transparent hover:border-white/30">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
                                I CAN HELP
                            </button>
</div>
</div>
<!-- Teardrop Map Marker -->
<button class="relative group cursor-pointer focus:outline-none">
<div class="w-10 h-10 bg-primary-container rounded-full rounded-br-none rotate-45 flex items-center justify-center shadow-md pulse-marker border-2 border-surface">
<span class="material-symbols-outlined text-on-primary-container -rotate-45 text-[20px]" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-4 h-1.5 bg-black/20 rounded-[100%] blur-[2px]"></div>
</button>
</div>
<!-- Secondary Incident Marker (Yellow) -->
<div class="absolute top-[65%] right-[25%] pointer-events-auto">
<button class="relative group cursor-pointer focus:outline-none hover:-translate-y-1 transition-transform">
<div class="w-8 h-8 bg-secondary-container rounded-full rounded-br-none rotate-45 flex items-center justify-center shadow-md border-2 border-surface">
<span class="material-symbols-outlined text-on-secondary-container -rotate-45 text-[16px]" style="font-variation-settings: 'FILL' 1;">car_crash</span>
</div>
</button>
</div>
</div>
<!-- Bottom Section: Floating Action Button -->
<div class="flex justify-end pointer-events-none mt-auto pb-4 pr-2">
<button class="bg-surface rounded-full shadow-[0px_4px_20px_rgba(0,0,0,0.15)] w-14 h-14 flex items-center justify-center text-primary-container hover:bg-surface-container-low active:bg-surface-variant transition-colors pointer-events-auto focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">
<span class="material-symbols-outlined text-[28px]">my_location</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface shadow-[0px_-4px_20px_rgba(0,0,0,0.1)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-all min-h-[48px] min-w-[48px]">
<span class="material-symbols-outlined text-[24px]">dashboard</span>
<span class="font-label-bold text-[11px] mt-1 tracking-wide">SOS Dashboard</span>
</button>
<!-- Active Navigation Element -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-2 scale-95 transition-transform duration-150 min-h-[48px]">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-label-bold text-[11px] mt-1 tracking-wide">Live Map</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-all min-h-[48px] min-w-[48px]">
<span class="material-symbols-outlined text-[24px]">forum</span>
<span class="font-label-bold text-[11px] mt-1 tracking-wide">Chat</span>
</button>
</nav>
</body></html>
